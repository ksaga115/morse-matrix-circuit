<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- black-translucent にするとホーム画面起動時にタッチ判定がステータスバー分ずれる iOS の既知バグがあるため black を使う -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#050505">
    <title>Morse Matrix Circuit</title>
    <style>
        :root {
            --bg: #050505;
            --panel-bg: #0d1117;
            --line-dim: #1a1a1a;
            --gold: #8c7340;
            --active: #f6e62e;
            --dot-color: #00d4ff;
            --dash-color: #ff3333;
            --unit-w: 45px;
            --unit-h: 38px;
            --ox: 40px;
            --oy: 45px;
        }

        /* iOSでの誤作動防止（長押し・選択・ズームの禁止） */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: manipulation;
            box-sizing: border-box;
        }

        html { height: 100%; overscroll-behavior: none; }
        body { 
            background: var(--bg); color: #adbac7; font-family: 'Consolas', 'Courier New', monospace; 
            margin: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden;
            /* iOS Safari の URL バー/ツールバー分を除いた実際の表示領域に合わせる。
               height を指定せず top/bottom の固定だけにすることで、Safari でもホーム画面起動時でも
               レイアウトと実際の画面サイズが必ず一致する（ズレによるタッチ判定の食い違いを防ぐ） */
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%;
            overscroll-behavior: none;
        }

        /* 1. 出力セクション */
        .output-section {
            width: 100%; padding: 15px; background: var(--panel-bg); 
            padding-top: calc(15px + env(safe-area-inset-top));
            display: grid; grid-template-columns: 1fr 2fr; gap: 10px;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }
        .display-box { background: #000; border: 1px solid #222; padding: 10px; border-radius: 4px; min-height: 55px; }
        .label { font-size: 0.6rem; color: #555; margin-bottom: 4px; text-transform: uppercase; }
        #code-monitor { font-size: 1.1rem; color: #539bf5; min-height: 1.2em; letter-spacing: 3px; }
        #message-box { font-size: 1.4rem; color: var(--active); min-height: 1.2em; word-break: break-all; }

        /* 2. チャート表示セクション */
        #chart-viewport {
            flex: 1; width: 100%; min-height: 0; position: relative;
            overflow: hidden; /* スクロールさせない */
            touch-action: none; /* タッチでのパン/ズームを禁止 */
            background: radial-gradient(circle, #080808 0%, #000 100%);
        }
        /* チャート全体を 1 枚の SVG として描画し、viewBox で表示領域にぴったり収める
           （固定サイズの要素が存在しないので、はみ出し = スクロールが発生しない） */
        #chart {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: block; overflow: hidden; pointer-events: none;
        }
        #chart path { fill: none; stroke: var(--line-dim); stroke-width: 1.5; transition: stroke 0.2s; }
        #chart path.active-dot { stroke: var(--dot-color); stroke-width: 3; filter: drop-shadow(0 0 4px var(--dot-color)); }
        #chart path.active-dash { stroke: var(--dash-color); stroke-width: 3; filter: drop-shadow(0 0 4px var(--dash-color)); }

        .node rect { fill: #000; stroke: var(--gold); stroke-width: 1; transition: 0.2s; }
        .node text {
            fill: var(--gold); font-size: 11px; font-weight: bold; font-family: inherit;
            text-anchor: middle; dominant-baseline: central; transition: 0.2s;
        }
        .node.active rect { fill: var(--active); stroke: #fff; filter: drop-shadow(0 0 8px var(--active)); }
        .node.active text { fill: #000; }

        /* 3. コントロールセクション */
        .controls {
            width: 100%; padding: 20px; background: var(--panel-bg);
            border-top: 1px solid #222; display: flex; justify-content: space-between; align-items: center;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            flex-shrink: 0;
        }
        .param-group { display: flex; flex-direction: column; gap: 10px; }
        .param { display: flex; align-items: center; gap: 12px; font-size: 0.7rem; color: #888; }
        .param span:first-child { width: 80px; }
        input[type=range] { width: 90px; accent-color: var(--gold); }
        
        #tap-btn {
            width: 95px; height: 95px; border-radius: 50%; border: 4px solid var(--gold);
            background: radial-gradient(circle, #222, #000); color: #fff;
            cursor: pointer; font-size: 0.9rem; font-weight: bold; font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            flex-shrink: 0; /* 狭い画面でも円形を保つ */
        }
        #tap-btn:active { background: #333; transform: scale(0.94); box-shadow: none; }
        
        .reset-btn { 
            background: #2a0000; color: #ff6666; border: 1px solid #552222; 
            padding: 6px 12px; border-radius: 4px; font-size: 0.7rem; cursor: pointer;
            margin-top: 8px; text-align: center;
        }

        /* 無線（超音波）バー */
        .radio-bar {
            width: 100%; padding: 8px 15px; background: var(--panel-bg);
            border-bottom: 1px solid #222; flex-shrink: 0;
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
            font-size: 0.7rem; color: #888;
        }
        .mode-group { display: flex; border: 1px solid #333; border-radius: 4px; overflow: hidden; }
        .mode-group button {
            background: #000; color: #777; border: none; padding: 6px 10px; font-family: inherit;
            font-size: 0.7rem; cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .mode-group button + button { border-left: 1px solid #333; }
        .mode-group button.on { background: var(--gold); color: #000; font-weight: bold; }
        .radio-bar .param span:first-child { width: auto; }
        .meter { position: relative; width: 90px; height: 8px; background: #000; border: 1px solid #333; border-radius: 2px; }
        .meter-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #539bf5; }
        .meter.hit .meter-fill { background: var(--active); }
        .meter-th { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--dash-color); }
        #radio-status { color: #666; flex-basis: 100%; min-height: 1em; }
        #radio-status.err { color: #ff6666; }
        .rx-only { display: none; }
        body.mode-rx .rx-only { display: flex; }
        body.mode-rx #tap-btn { opacity: 0.35; }
        body.tone-on #tap-btn { border-color: var(--active); box-shadow: 0 0 14px var(--active); }

        /* 4. 幅の狭い端末（320px 前後）向け: コントロールをコンパクトにして横にはみ出さないようにする */
        @media (max-width: 360px) {
            .controls { padding-left: 12px; padding-right: 12px; gap: 8px; }
            .param { gap: 8px; font-size: 0.65rem; }
            .param span:first-child { width: 56px; }
            input[type=range] { width: 70px; }
            #tap-btn { width: 80px; height: 80px; font-size: 0.8rem; }
            .output-section { padding-left: 10px; padding-right: 10px; gap: 8px; }
            .radio-bar { padding-left: 10px; padding-right: 10px; gap: 6px 10px; }
            .meter { width: 70px; }
        }

        /* 5. 横向き（高さが足りない画面）向け: チャートを左いっぱいに、表示と操作パネルを右側の列にまとめる */
        @media (orientation: landscape) and (max-height: 540px) {
            body {
                display: grid;
                grid-template-columns: 1fr minmax(230px, 300px);
                grid-template-rows: auto auto 1fr;
                align-items: stretch;
            }
            #chart-viewport {
                grid-column: 1; grid-row: 1 / 4;
                padding-left: env(safe-area-inset-left);
            }
            .output-section {
                grid-column: 2; grid-row: 1;
                grid-template-columns: 1fr; gap: 8px;
                padding: 10px; padding-top: calc(10px + env(safe-area-inset-top));
                padding-right: calc(10px + env(safe-area-inset-right));
                border-bottom: 1px solid #222; border-left: 1px solid #222;
            }
            .radio-bar {
                grid-column: 2; grid-row: 2; padding: 6px 10px;
                padding-right: calc(10px + env(safe-area-inset-right));
                border-left: 1px solid #222; gap: 6px 10px;
            }
            .display-box { min-height: 44px; }
            #message-box { font-size: 1.1rem; }
            .controls {
                grid-column: 2; grid-row: 3;
                flex-direction: column; justify-content: space-evenly; gap: 8px;
                padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
                padding-right: calc(10px + env(safe-area-inset-right));
                border-top: none; border-left: 1px solid #222;
                min-height: 0; overflow: hidden;
            }
            .param-group { gap: 6px; }
            .reset-btn { margin-top: 4px; }
            #tap-btn { width: 80px; height: 80px; }
        }

        /* 6. さらに高さの低い横向き画面（320px 前後）向け: 右列をよりコンパクトに */
        @media (orientation: landscape) and (max-height: 360px) {
            .output-section { padding: 6px; padding-top: calc(6px + env(safe-area-inset-top)); gap: 6px; }
            .display-box { min-height: 36px; padding: 6px 8px; }
            .label { margin-bottom: 2px; }
            #code-monitor { font-size: 0.9rem; min-height: 1em; }
            #message-box { font-size: 1rem; min-height: 1em; }
            .controls { padding: 6px 10px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); gap: 4px; }
            .param { gap: 8px; font-size: 0.62rem; }
            .param span:first-child { width: 56px; }
            input[type=range] { width: 70px; }
            .param-group { gap: 4px; }
            .reset-btn { margin-top: 2px; padding: 4px 8px; }
            #tap-btn { width: 64px; height: 64px; font-size: 0.75rem; border-width: 3px; }
        }
    </style>
</head>
<body>

<div class="output-section">
    <div class="display-box">
        <div class="label">Incoming Code</div>
        <div id="code-monitor"></div>
    </div>
    <div class="display-box">
        <div class="label">Decoded Message</div>
        <div id="message-box"></div>
    </div>
</div>

<div class="radio-bar">
    <div class="mode-group">
        <button data-mode="local" class="on">LOCAL</button>
        <button data-mode="tx">TX 送信</button>
        <button data-mode="rx">RX 受信</button>
    </div>
    <div class="param">
        <span>FREQ</span>
        <input type="range" id="freq" min="15000" max="20000" step="100" value="18500">
        <span id="v-freq">18.5kHz</span>
    </div>
    <div class="param rx-only">
        <span>RX-TH</span>
        <input type="range" id="rx-thresh" min="3" max="30" step="1" value="12">
        <span id="v-rx">12dB</span>
    </div>
    <div class="param rx-only">
        <span>LEVEL</span>
        <div class="meter" id="meter"><div class="meter-fill" id="meter-fill"></div><div class="meter-th" id="meter-th"></div></div>
    </div>
    <div id="radio-status"></div>
</div>

<div id="chart-viewport">
    <svg id="chart" viewBox="0 0 450 350" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <g id="lines"></g>
        <g id="nodes"></g>
    </svg>
</div>

<div class="controls">
    <div class="param-group">
        <div class="param">
            <span>DASH-TH</span>
            <input type="range" id="dash-thresh" min="100" max="1000" step="10" value="200">
            <span id="v-dash">200ms</span>
        </div>
        <div class="param">
            <span>WAIT-TH</span>
            <input type="range" id="wait-thresh" min="100" max="1000" step="10" value="800">
            <span id="v-wait">800ms</span>
        </div>
        <div class="reset-btn" onclick="fullReset()">SYSTEM RESET</div>
    </div>
    <button id="tap-btn">SIGNAL</button>
</div>

<script>
    // 1. 全アルファベット辞書（省略なし）
    const morseDict = {
        "・":"E","・・":"I","・・・":"S","・・・・":"H","・ー":"A","・ー・":"R","・ー・・":"L","・・ー":"U","・・ー・":"F","・・・ー":"V","・ーー":"W","・ーー・":"P","・ーーー":"J",
        "ー":"T","ーー":"M","ーーー":"O","ー・":"N","ー・・":"D","ー・・・":"B","ー・ー":"K","ー・ー・":"C","ー・ーー":"Y","ーー・":"G","ーー・・":"Z","ーー・ー":"Q","ー・・ー":"X"
    };

    // 2. 遷移ツリー（省略なし）
    const tree = {
        "start": {"・":"E", "ー":"T"},
        "E": {"・":"I", "ー":"A"}, "I": {"・":"S", "ー":"U"}, "S": {"・":"H", "ー":"V"}, "U": {"・":"F"},
        "A": {"・":"R", "ー":"W"}, "R": {"・":"L"}, "W": {"・":"P", "ー":"J"},
        "T": {"・":"N", "ー":"M"}, "N": {"・":"D", "ー":"K"}, "D": {"・":"B", "ー":"X"}, "M": {"・":"G", "ー":"O"},
        "G": {"・":"Z", "ー":"Q"}, "K": {"・":"C", "ー":"Y"}
    };

    // ノード配置（グリッド座標）
    const nodeDefs = {
        start: {x:3, y:0, label:"S"},
        o: {x:0, y:-1, label:"O"}, m: {x:1, y:-1, label:"M"}, t: {x:2, y:-1, label:"T"},
        q: {x:0, y:-2, label:"Q"}, g: {x:1, y:-2, label:"G"}, z: {x:1, y:-3, label:"Z"},
        y: {x:0, y:-4, label:"Y"}, k: {x:1, y:-4, label:"K"}, n: {x:2, y:-4, label:"N"},
        c: {x:1, y:-5, label:"C"}, x: {x:1, y:-6, label:"X"}, d: {x:2, y:-6, label:"D"}, b: {x:2, y:-7, label:"B"},
        e: {x:4, y:-1, label:"E"}, i: {x:5, y:-1, label:"I"}, s: {x:7, y:-1, label:"S"}, h: {x:8, y:-1, label:"H"},
        u: {x:5, y:-2, label:"U"}, f: {x:6, y:-2, label:"F"}, v: {x:7, y:-2, label:"V"},
        a: {x:4, y:-4, label:"A"}, r: {x:5, y:-4, label:"R"}, l: {x:7, y:-4, label:"L"},
        w: {x:4, y:-6, label:"W"}, p: {x:5, y:-6, label:"P"}, j: {x:4, y:-7, label:"J"}
    };

    const SVG_NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById('lines');
    const nodesLayer = document.getElementById('nodes');
    const uw = 45, uh = 38, ox = 40, oy = 45, nodeSize = 20;

    // 3. 座標計算とノード配置
    function getPos(id) {
        const d = nodeDefs[id.toLowerCase()];
        return d ? { x: d.x * uw + ox, y: Math.abs(d.y) * uh + oy } : {x:0, y:0};
    }

    for (let id in nodeDefs) {
        const p = getPos(id);
        const g = document.createElementNS(SVG_NS, "g");
        g.setAttribute("class", "node" + (id === "start" ? " active" : ""));
        g.id = `n-${id}`;
        const rect = document.createElementNS(SVG_NS, "rect");
        rect.setAttribute("x", p.x - nodeSize / 2);
        rect.setAttribute("y", p.y - nodeSize / 2);
        rect.setAttribute("width", nodeSize);
        rect.setAttribute("height", nodeSize);
        const text = document.createElementNS(SVG_NS, "text");
        text.setAttribute("x", p.x);
        text.setAttribute("y", p.y);
        text.textContent = nodeDefs[id].label;
        g.appendChild(rect);
        g.appendChild(text);
        nodesLayer.appendChild(g);
    }

    // 4. SVG配線の初期描画
    for (let from in tree) {
        for (let sym in tree[from]) {
            const to = tree[from][sym];
            const p1 = getPos(from), p2 = getPos(to);
            const path = document.createElementNS(SVG_NS, "path");
            // クランク（カクカク）状に配線
            path.setAttribute("d", `M ${p1.x} ${p1.y} V ${(p1.y + p2.y) / 2} H ${p2.x} V ${p2.y}`);
            path.id = `line-${from}-${to}`;
            svg.appendChild(path);
        }
    }

    // ページ全体のスクロール/バウンスを抑止（スライダー以外のタッチ移動を無効化）
    document.addEventListener('touchmove', (e) => {
        if (!e.target.closest('input[type=range]')) e.preventDefault();
    }, { passive: false });
    // iOS Safari のピンチズームを抑止（ズームするとページがスクロール可能になってしまうため）
    document.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    // 万一ページがずれてしまった場合に備え、常に先頭位置へ戻す（ホーム画面起動時のタッチ判定ずれ対策）
    const resetScroll = () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); };
    window.addEventListener('scroll', resetScroll, { passive: true });
    window.addEventListener('resize', resetScroll);
    window.addEventListener('orientationchange', () => setTimeout(resetScroll, 100));
    window.addEventListener('pageshow', resetScroll);

    // 5. ロジック本体
    // 入力は「キーが下りた / 上がった」の 2 つだけに集約し、ボタンでもマイク（受信）でも同じ判定を通す
    let start = null, timer, code = "";
    const btn = document.getElementById('tap-btn');

    function update() {
        // すべてのリセット
        document.querySelectorAll('.node, path').forEach(el => el.classList.remove('active', 'active-dot', 'active-dash'));
        document.getElementById('n-start').classList.add('active');

        let curr = "start";
        for (let s of code.split('')) {
            const next = tree[curr] ? tree[curr][s] : null;
            if (next) {
                const line = document.getElementById(`line-${curr}-${next}`);
                if (line) line.classList.add(s === '・' ? 'active-dot' : 'active-dash');
                const n = document.getElementById(`n-${next.toLowerCase()}`);
                if (n) n.classList.add('active');
                curr = next;
            }
        }
    }

    function keyDown(t) {
        start = t;
        clearTimeout(timer);
    }

    function keyUp(t) {
        if (start === null) return;
        const dur = t - start;
        start = null;

        code += (dur < Number(document.getElementById('dash-thresh').value)) ? "・" : "ー";
        document.getElementById('code-monitor').innerText = code;
        update();

        timer = setTimeout(() => {
            const res = morseDict[code];
            if (res) document.getElementById('message-box').innerText += res;
            code = "";
            document.getElementById('code-monitor').innerText = "";
            update();
        }, Number(document.getElementById('wait-thresh').value));
    }

    // イベント処理（iPhoneのマルチタッチやマウス両対応）
    // 受信モード中はボタンを無視する（入力はマイクから来る）
    const handleStart = (e) => {
        e.preventDefault();
        if (mode === 'rx') return;
        if (mode === 'tx') toneOn();
        keyDown(performance.now());
    };

    const handleEnd = (e) => {
        if (mode === 'rx') return;
        if (mode === 'tx') toneOff();
        keyUp(performance.now());
    };

    btn.addEventListener('touchstart', handleStart);
    btn.addEventListener('touchend', handleEnd);
    btn.addEventListener('touchcancel', handleEnd);
    btn.addEventListener('mousedown', handleStart);
    btn.addEventListener('mouseup', handleEnd);

    // 6. 無線（超音波）
    // 送信: ボタンを押している間だけ高い音を鳴らす。受信: マイクでその周波数だけを見張る。
    // 音の立ち上がり/立ち下がりを急にすると「プチッ」という聞こえる雑音が出るので、RAMP 秒かけて増減する。
    const RAMP = 0.012;
    let mode = 'local', actx = null, osc = null, gain = null;
    let micStream = null, analyser = null, rxTimer = null;
    const statusEl = document.getElementById('radio-status');
    const freqEl = document.getElementById('freq');
    const rxThEl = document.getElementById('rx-thresh');

    function setStatus(msg, err) {
        statusEl.textContent = msg || '';
        statusEl.classList.toggle('err', !!err);
    }

    function audioCtx() {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        return actx;
    }

    function toneOn() {
        if (!gain) return;
        const t = actx.currentTime;
        osc.frequency.setValueAtTime(Number(freqEl.value), t);
        gain.gain.cancelScheduledValues(t);
        gain.gain.setValueAtTime(gain.gain.value, t);
        gain.gain.linearRampToValueAtTime(1, t + RAMP);
        document.body.classList.add('tone-on');
    }

    function toneOff() {
        if (!gain) return;
        const t = actx.currentTime;
        gain.gain.cancelScheduledValues(t);
        gain.gain.setValueAtTime(gain.gain.value, t);
        gain.gain.linearRampToValueAtTime(0, t + RAMP);
        document.body.classList.remove('tone-on');
    }

    function startTx() {
        // iPhone のマナーモードでも Web Audio を鳴らせるようにする（Safari 16.4+）
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
        const ctx = audioCtx();
        osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = Number(freqEl.value);
        gain = ctx.createGain();
        gain.gain.value = 0;
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        setStatus('送信中: SIGNAL を押している間だけ ' + (freqEl.value / 1000).toFixed(1) + 'kHz を出します。音量は最大に');
    }

    function stopTx() {
        if (osc) { try { osc.stop(); } catch (e) {} osc.disconnect(); }
        osc = null; gain = null;
        document.body.classList.remove('tone-on');
    }

    async function startRx() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setStatus('マイクが使えません（https で開いてください）', true);
            return false;
        }
        try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) {}
        const ctx = audioCtx();
        let stream;
        try {
            // 音声通話向けの加工（エコー除去・雑音除去・自動音量）は高い音を消してしまうので切る
            stream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            });
        } catch (e) {
            setStatus('マイクを使う許可がありません: ' + e.message, true);
            return false;
        }
        // 許可を待つ間に別のモードへ切り替えられていたら捨てる
        if (mode !== 'rx') { stream.getTracks().forEach(tr => tr.stop()); return true; }
        micStream = stream;
        analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;            // 48kHz で約 21ms の窓。短い「・」でも埋もれない
        analyser.smoothingTimeConstant = 0;
        // 出口（スピーカー）につながっていないノードはブラウザが処理を省くことがあるので、音量 0 でつないでおく
        const mute = ctx.createGain();
        mute.gain.value = 0;
        ctx.createMediaStreamSource(micStream).connect(analyser).connect(mute).connect(ctx.destination);
        rxLoop();
        setStatus('受信中: ' + (freqEl.value / 1000).toFixed(1) + 'kHz を聞いています（マイク ' + Math.round(ctx.sampleRate / 1000) + 'kHz）');
        return true;
    }

    function stopRx() {
        clearInterval(rxTimer); rxTimer = null;
        if (micStream) micStream.getTracks().forEach(tr => tr.stop());
        micStream = null; analyser = null;
        if (start !== null) keyUp(performance.now());
        document.getElementById('meter-fill').style.width = '0';
        document.getElementById('meter').classList.remove('hit');
    }

    // 受信ループ: 目当ての周波数の強さを「少し下の帯域の中央値」と比べた差（dB）で判定する。
    // 周囲の雑音が大きくなっても差で見るので、しきい値を毎回合わせ直さなくて済む。
    // チラつきで ・ を誤検出しないよう、状態が STABLE ms 続いたら確定し、時刻は変化した瞬間まで遡る。
    const STABLE = 25, OFF_HYST = 6, METER_MAX = 40;
    function rxLoop() {
        const buf = new Float32Array(analyser.frequencyBinCount);
        let raw = false, rawSince = 0, on = false;
        rxTimer = setInterval(() => {
            if (!analyser) return;
            analyser.getFloatFrequencyData(buf);
            const binHz = actx.sampleRate / analyser.fftSize;
            const k = Math.round(Number(freqEl.value) / binHz);
            const db = (i) => (i >= 0 && i < buf.length && isFinite(buf[i])) ? buf[i] : -160;
            const sig = Math.max(db(k - 1), db(k), db(k + 1));
            // 比較用: 目当てより 0.5〜1.5kHz 下。上側はマイクのフィルタで削られていることがあるので使わない
            const ref = [];
            for (let i = k - Math.round(1500 / binHz); i <= k - Math.round(500 / binHz); i++) ref.push(db(i));
            ref.sort((a, b) => a - b);
            const snr = sig - ref[ref.length >> 1];

            const th = Number(rxThEl.value);
            const now = performance.now();
            const want = on ? snr > th - OFF_HYST : snr > th;
            if (want !== raw) { raw = want; rawSince = now; }
            if (raw !== on && now - rawSince >= STABLE) {
                on = raw;
                if (on) keyDown(rawSince); else keyUp(rawSince);
            }

            const fill = Math.max(0, Math.min(1, snr / METER_MAX));
            document.getElementById('meter-fill').style.width = (fill * 100) + '%';
            document.getElementById('meter').classList.toggle('hit', on);
        }, 10);
    }

    async function setMode(m) {
        if (m === mode) return;
        if (mode === 'tx') stopTx();
        if (mode === 'rx') stopRx();
        mode = m;
        document.querySelectorAll('.mode-group button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
        document.body.classList.toggle('mode-rx', m === 'rx');
        setStatus('');
        if (m === 'tx') startTx();
        if (m === 'rx') { const ok = await startRx(); if (!ok && mode === 'rx') setMode('local'); }
    }

    document.querySelectorAll('.mode-group button').forEach(b => {
        b.addEventListener('click', () => setMode(b.dataset.mode));
    });

    freqEl.oninput = function() {
        document.getElementById('v-freq').innerText = (this.value / 1000).toFixed(1) + "kHz";
        if (osc) osc.frequency.setValueAtTime(Number(this.value), actx.currentTime);
    };
    function showRxTh() {
        document.getElementById('v-rx').innerText = rxThEl.value + "dB";
        document.getElementById('meter-th').style.left = Math.min(100, rxThEl.value / METER_MAX * 100) + '%';
    }
    rxThEl.oninput = showRxTh;
    showRxTh();

    // リセット関数
    function fullReset() {
        document.getElementById('message-box').innerText = "";
        document.getElementById('code-monitor').innerText = "";
        code = "";
        update();
    }

    // 設定スライダー
    document.getElementById('dash-thresh').oninput = function() { document.getElementById('v-dash').innerText = this.value + "ms"; };
    document.getElementById('wait-thresh').oninput = function() { document.getElementById('v-wait').innerText = this.value + "ms"; };
</script>
</body>
</html>
