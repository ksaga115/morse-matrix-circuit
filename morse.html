<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- black-translucent にするとホーム画面起動時にタッチ判定がステータスバー分ずれる iOS の既知バグがあるため black を使う -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#050505">
    <title>Morse Matrix Circuit</title>
    <style>
        :root {
            --bg: #050505;
            --panel-bg: #0d1117;
            --line-dim: #1a1a1a;
            --gold: #8c7340;
            --active: #f6e62e;
            --dot-color: #00d4ff;
            --dash-color: #ff3333;
            --unit-w: 45px;
            --unit-h: 38px;
            --ox: 40px;
            --oy: 45px;
        }

        /* iOSでの誤作動防止（長押し・選択・ズームの禁止） */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: manipulation;
            box-sizing: border-box;
        }

        html { height: 100%; overscroll-behavior: none; }
        body { 
            background: var(--bg); color: #adbac7; font-family: 'Consolas', 'Courier New', monospace; 
            margin: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden;
            /* iOS Safari の URL バー/ツールバー分を除いた実際の表示領域に合わせる。
               height を指定せず top/bottom の固定だけにすることで、Safari でもホーム画面起動時でも
               レイアウトと実際の画面サイズが必ず一致する（ズレによるタッチ判定の食い違いを防ぐ） */
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%;
            overscroll-behavior: none;
        }

        /* 1. 出力セクション */
        .output-section {
            width: 100%; padding: 15px; background: var(--panel-bg); 
            padding-top: calc(15px + env(safe-area-inset-top));
            display: grid; grid-template-columns: 1fr 2fr; gap: 10px;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }
        .display-box { background: #000; border: 1px solid #222; padding: 10px; border-radius: 4px; min-height: 55px; }
        .label { font-size: 0.6rem; color: #555; margin-bottom: 4px; text-transform: uppercase; }
        #code-monitor { font-size: 1.1rem; color: #539bf5; min-height: 1.2em; letter-spacing: 3px; }
        #dur-monitor { font-size: 0.6rem; color: #666; min-height: 1em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #message-box { font-size: 1.4rem; color: var(--active); min-height: 1.2em; word-break: break-all; white-space: pre-wrap; }

        /* 2. チャート表示セクション */
        #chart-viewport {
            flex: 1; width: 100%; min-height: 0; position: relative;
            overflow: hidden; /* スクロールさせない */
            touch-action: none; /* タッチでのパン/ズームを禁止 */
            background: radial-gradient(circle, #080808 0%, #000 100%);
        }
        /* チャート全体を 1 枚の SVG として描画し、viewBox で表示領域にぴったり収める
           （固定サイズの要素が存在しないので、はみ出し = スクロールが発生しない） */
        #chart {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: block; overflow: hidden; pointer-events: none;
        }
        #chart path { fill: none; stroke: var(--line-dim); stroke-width: 1.5; transition: stroke 0.2s; }
        #chart path.active-dot { stroke: var(--dot-color); stroke-width: 3; filter: drop-shadow(0 0 4px var(--dot-color)); }
        #chart path.active-dash { stroke: var(--dash-color); stroke-width: 3; filter: drop-shadow(0 0 4px var(--dash-color)); }

        .node rect { fill: #000; stroke: var(--gold); stroke-width: 1; transition: 0.2s; }
        .node text {
            fill: var(--gold); font-size: 11px; font-weight: bold; font-family: inherit;
            text-anchor: middle; dominant-baseline: central; transition: 0.2s;
        }
        .node.active rect { fill: var(--active); stroke: #fff; filter: drop-shadow(0 0 8px var(--active)); }
        .node.active text { fill: #000; }
        .node.blank rect { stroke: #333; }

        /* 3. コントロールセクション */
        .controls {
            width: 100%; padding: 20px; background: var(--panel-bg);
            border-top: 1px solid #222; display: flex; justify-content: space-between; align-items: center;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            flex-shrink: 0;
        }
        .param-group { display: flex; flex-direction: column; gap: 10px; }
        .param { display: flex; align-items: center; gap: 12px; font-size: 0.7rem; color: #888; }
        .param span:first-child { width: 80px; }
        input[type=range] { width: 90px; accent-color: var(--gold); }
        
        #tap-btn {
            width: 95px; height: 95px; border-radius: 50%; border: 4px solid var(--gold);
            background: radial-gradient(circle, #222, #000); color: #fff;
            cursor: pointer; font-size: 0.9rem; font-weight: bold; font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            flex-shrink: 0; /* 狭い画面でも円形を保つ */
        }
        #tap-btn:active, #tap-btn.pressed { background: #333; transform: scale(0.94); box-shadow: none; }
        #v-timing { font-size: 0.6rem; color: #666; }
        
        .reset-btn { 
            background: #2a0000; color: #ff6666; border: 1px solid #552222; 
            padding: 6px 12px; border-radius: 4px; font-size: 0.7rem; cursor: pointer;
            margin-top: 8px; text-align: center;
        }

        /* 無線（超音波）バー */
        .radio-bar {
            width: 100%; padding: 8px 15px; background: var(--panel-bg);
            border-bottom: 1px solid #222; flex-shrink: 0;
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
            font-size: 0.7rem; color: #888;
        }
        .mode-group, .alpha-group { display: flex; border: 1px solid #333; border-radius: 4px; overflow: hidden; }
        .mode-group button, .alpha-group button {
            background: #000; color: #777; border: none; padding: 6px 10px; font-family: inherit;
            font-size: 0.7rem; cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .mode-group button + button, .alpha-group button + button { border-left: 1px solid #333; }
        .mode-group button.on, .alpha-group button.on { background: var(--gold); color: #000; font-weight: bold; }
        .radio-bar .param span:first-child { width: auto; }
        .meter { position: relative; width: 90px; height: 8px; background: #000; border: 1px solid #333; border-radius: 2px; }
        .meter-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #539bf5; }
        .meter.hit .meter-fill { background: var(--active); }
        .meter-th { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--dash-color); }
        #radio-status { color: #666; flex-basis: 100%; min-height: 1em; }
        #radio-status.err { color: #ff6666; }
        .alpha-group { border-color: #333; }
        .send-row { display: flex; gap: 6px; flex-basis: 100%; }
        #send-text {
            flex: 1; min-width: 0; background: #000; color: #adbac7; border: 1px solid #333; border-radius: 4px;
            padding: 6px 8px; font-family: inherit; font-size: 16px; /* 16px 未満だと iOS がフォーカス時に拡大する */
            -webkit-user-select: text; user-select: text;
        }
        #send-btn {
            background: #000; color: var(--gold); border: 1px solid var(--gold); border-radius: 4px;
            padding: 0 12px; font-family: inherit; font-size: 0.75rem; font-weight: bold; cursor: pointer;
        }
        body.sending #send-btn { background: #2a0000; color: #ff6666; border-color: #552222; }
        body.mode-rx .send-row { display: none; }
        body.sending #tap-btn { opacity: 0.35; }
        #auto-btn {
            background: #000; color: #777; border: 1px solid #333; border-radius: 4px; padding: 6px 10px;
            font-family: inherit; font-size: 0.7rem; cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        #auto-btn.on { background: var(--gold); color: #000; font-weight: bold; border-color: var(--gold); }
        .rx-only { display: none; }
        body.mode-rx .rx-only { display: flex; }
        body.mode-rx #tap-btn { opacity: 0.35; }
        body.tone-on #tap-btn { border-color: var(--active); box-shadow: 0 0 14px var(--active); }

        /* 4. 幅の狭い端末（320px 前後）向け: コントロールをコンパクトにして横にはみ出さないようにする */
        @media (max-width: 360px) {
            .controls { padding-left: 12px; padding-right: 12px; gap: 8px; }
            .param { gap: 8px; font-size: 0.65rem; }
            .param span:first-child { width: 56px; }
            input[type=range] { width: 70px; }
            #tap-btn { width: 80px; height: 80px; font-size: 0.8rem; }
            .output-section { padding-left: 10px; padding-right: 10px; gap: 8px; }
            .radio-bar { padding-left: 10px; padding-right: 10px; gap: 6px 10px; }
            .meter { width: 70px; }
        }

        /* 5. 横向き（高さが足りない画面）向け: チャートを左いっぱいに、表示と操作パネルを右側の列にまとめる */
        @media (orientation: landscape) and (max-height: 540px) {
            body {
                display: grid;
                grid-template-columns: 1fr minmax(300px, 400px);
                grid-template-rows: auto auto 1fr;
                align-items: stretch;
            }
            #chart-viewport {
                grid-column: 1; grid-row: 1 / 4;
                padding-left: env(safe-area-inset-left);
            }
            .output-section {
                grid-column: 2; grid-row: 1;
                grid-template-columns: 1fr 2fr; gap: 8px;
                padding: 10px; padding-top: calc(10px + env(safe-area-inset-top));
                padding-right: calc(10px + env(safe-area-inset-right));
                border-bottom: 1px solid #222; border-left: 1px solid #222;
            }
            .radio-bar {
                grid-column: 2; grid-row: 2; padding: 6px 10px;
                padding-right: calc(10px + env(safe-area-inset-right));
                border-left: 1px solid #222; gap: 6px 10px;
            }
            .display-box { min-height: 44px; }
            #message-box { font-size: 1.1rem; }
            .controls {
                grid-column: 2; grid-row: 3;
                flex-direction: row; justify-content: space-between; align-items: center; gap: 8px;
                padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
                padding-right: calc(10px + env(safe-area-inset-right));
                border-top: none; border-left: 1px solid #222;
                min-height: 0; overflow: hidden;
            }
            .param-group { gap: 6px; }
            .reset-btn { margin-top: 4px; }
            #tap-btn { width: 80px; height: 80px; }
            #radio-status:empty { display: none; }
        }

        /* 6. さらに高さの低い横向き画面（320px 前後）向け: 右列をよりコンパクトに */
        @media (orientation: landscape) and (max-height: 360px) {
            .output-section { padding: 6px; padding-top: calc(6px + env(safe-area-inset-top)); gap: 6px; }
            .display-box { min-height: 36px; padding: 6px 8px; }
            .label { margin-bottom: 2px; }
            #code-monitor { font-size: 0.9rem; min-height: 1em; }
            #message-box { font-size: 1rem; min-height: 1em; }
            .controls { padding: 6px 10px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); gap: 4px; }
            .param { gap: 8px; font-size: 0.62rem; }
            .param span:first-child { width: 56px; }
            input[type=range] { width: 70px; }
            .param-group { gap: 4px; }
            .reset-btn { margin-top: 2px; padding: 4px 8px; }
            #tap-btn { width: 64px; height: 64px; font-size: 0.75rem; border-width: 3px; }
        }
    </style>
</head>
<body>

<div class="output-section">
    <div class="display-box">
        <div class="label">Incoming Code</div>
        <div id="code-monitor"></div>
        <div id="dur-monitor"></div>
    </div>
    <div class="display-box">
        <div class="label">Decoded Message</div>
        <div id="message-box"></div>
    </div>
</div>

<div class="radio-bar">
    <div class="mode-group">
        <button data-mode="local" class="on">LOCAL</button>
        <button data-mode="tx">TX 送信</button>
        <button data-mode="rx">RX 受信</button>
    </div>
    <div class="alpha-group">
        <button data-alpha="en" class="on">欧文</button>
        <button data-alpha="ja">和文</button>
    </div>
    <button id="auto-btn" class="on" title="・とーの境目を、受け取った長さから自動で決める">長短 AUTO</button>
    <div class="param">
        <span>FREQ</span>
        <input type="range" id="freq" min="15000" max="23000" step="100" value="18500">
        <span id="v-freq">18.5kHz</span>
    </div>
    <div class="param rx-only">
        <span>RX-TH</span>
        <input type="range" id="rx-thresh" min="3" max="30" step="1" value="12">
        <span id="v-rx">12dB</span>
    </div>
    <div class="param rx-only">
        <span>LEVEL</span>
        <div class="meter" id="meter"><div class="meter-fill" id="meter-fill"></div><div class="meter-th" id="meter-th"></div></div>
    </div>
    <div class="send-row">
        <input type="text" id="send-text" placeholder="A-Z / 0-9（例: HELLO WORLD）" enterkeyhint="send" autocomplete="off">
        <button id="send-btn">SEND</button>
    </div>
    <div id="radio-status"></div>
</div>

<div id="chart-viewport">
    <svg id="chart" viewBox="0 0 450 350" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <g id="lines"></g>
        <g id="nodes"></g>
    </svg>
</div>

<div class="controls">
    <div class="param-group">
        <div class="param">
            <span>SPEED</span>
            <input type="range" id="wpm" min="5" max="30" step="1" value="8">
            <span id="v-wpm">8WPM</span>
        </div>
        <div class="param"><span id="v-timing"></span></div>
        <div class="reset-btn" onclick="fullReset()">SYSTEM RESET</div>
    </div>
    <button id="tap-btn">SIGNAL</button>
</div>

<script>
    // 1. 符号表。キーは符号（・ と ー の並び）、値は文字
    // 欧文: A〜Z と数字・記号
    const EN_DICT = {
        "・":"E","・・":"I","・・・":"S","・・・・":"H","・ー":"A","・ー・":"R","・ー・・":"L","・・ー":"U","・・ー・":"F","・・・ー":"V","・ーー":"W","・ーー・":"P","・ーーー":"J",
        "ー":"T","ーー":"M","ーーー":"O","ー・":"N","ー・・":"D","ー・・・":"B","ー・ー":"K","ー・ー・":"C","ー・ーー":"Y","ーー・":"G","ーー・・":"Z","ーー・ー":"Q","ー・・ー":"X",
        "・ーーーー":"1","・・ーーー":"2","・・・ーー":"3","・・・・ー":"4","・・・・・":"5",
        "ー・・・・":"6","ーー・・・":"7","ーーー・・":"8","ーーーー・":"9","ーーーーー":"0",
        "・ー・ー・ー":".","ーー・・ーー":",","・・ーー・・":"?"
    };
    // 和文: カナ 48 字と濁点・半濁点・長音・句読点。数字は欧文と同じ符号（和文の符号とぶつからない）
    const JA_DICT = {
        "・ー":"イ","・ー・ー":"ロ","ー・・・":"ハ","ー・ー・":"ニ","ー・・":"ホ","・":"ヘ","・・ー・・":"ト",
        "・・ー・":"チ","ーー・":"リ","・・・・":"ヌ","ー・ーー・":"ル","・ーーー":"ヲ",
        "ー・ー":"ワ","・ー・・":"カ","ーー":"ヨ","ー・":"タ","ーーー":"レ","ーーー・":"ソ",
        "・ーー・":"ツ","ーー・ー":"ネ","・ー・":"ナ","・・・":"ラ","ー":"ム",
        "・・ー":"ウ","・ー・・ー":"ヰ","・・ーー":"ノ","・ー・・・":"オ","・・・ー":"ク","・ーー":"ヤ","ー・・ー":"マ",
        "ー・ーー":"ケ","ーー・・":"フ","ーーーー":"コ","ー・ーーー":"エ","・ー・ーー":"テ",
        "ーー・ーー":"ア","ー・ー・ー":"サ","ー・ー・・":"キ","ー・・ーー":"ユ","ー・・・ー":"メ","・・ー・ー":"ミ","ーー・ー・":"シ",
        "・ーー・・":"ヱ","ーー・・ー":"ヒ","ー・・ー・":"モ","・ーーー・":"セ","ーーー・ー":"ス","・ー・ー・":"ン",
        "・・":"゛","・・ーー・":"゜","・ーー・ー":"ー","・ー・ー・ー":"、","・ー・ー・・":"。",
        "・ーーーー":"1","・・ーーー":"2","・・・ーー":"3","・・・・ー":"4","・・・・・":"5",
        "ー・・・・":"6","ーー・・・":"7","ーーー・・":"8","ーーーー・":"9","ーーーーー":"0"
    };
    const ALPHABETS = { en: EN_DICT, ja: JA_DICT };
    let alpha = 'en';
    let morseDict = EN_DICT;

    // 2. 欧文チャートの配置（手で並べた回路図。文字 → グリッド座標）
    const EN_LAYOUT = {
        "":{x:3, y:0, label:"S"},
        O:{x:0, y:1}, M:{x:1, y:1}, T:{x:2, y:1},
        Q:{x:0, y:2}, G:{x:1, y:2}, Z:{x:1, y:3},
        Y:{x:0, y:4}, K:{x:1, y:4}, N:{x:2, y:4},
        C:{x:1, y:5}, X:{x:1, y:6}, D:{x:2, y:6}, B:{x:2, y:7},
        E:{x:4, y:1}, I:{x:5, y:1}, S:{x:7, y:1}, H:{x:8, y:1},
        U:{x:5, y:2}, F:{x:6, y:2}, V:{x:7, y:2},
        A:{x:4, y:4}, R:{x:5, y:4}, L:{x:7, y:4},
        W:{x:4, y:6}, P:{x:5, y:6}, J:{x:4, y:7}
    };

    const SVG_NS = "http://www.w3.org/2000/svg";
    const svgEl = document.getElementById('chart');
    const linesLayer = document.getElementById('lines');
    const nodesLayer = document.getElementById('nodes');
    let nodeEls = {}, lineEls = {};   // 符号 → 要素（線は行き先の符号で引く）

    // 3. チャートの組み立て
    // 欧文: 手で並べた配置を、上から下へ縦に配線する。
    function enChart() {
        const uw = 45, uh = 38, ox = 40, oy = 45;
        const codeOf = {};
        for (const c in EN_DICT) codeOf[EN_DICT[c]] = c;
        const nodes = {};
        for (const ch in EN_LAYOUT) {
            const d = EN_LAYOUT[ch];
            nodes[ch === "" ? "" : codeOf[ch]] = { x: d.x * uw + ox, y: d.y * uh + oy, label: d.label || ch };
        }
        return { viewBox: "0 0 450 350", nodes, size: 20, font: 11,
                 wire: (a, b) => `M ${a.x} ${a.y} V ${(a.y + b.y) / 2} H ${b.x} V ${b.y}` };
    }
    // 和文: 字数が多いので自動で並べる。欧文の図と同じく S を真ん中に置き、・ で始まる側は右へ、ー で始まる側は左へ
    // 1 符号ずつ進む。枝分かれは ・ が上、ー が下。左右に振り分けることで、1 本の木より高さが半分ほどになる。
    function jaChart() {
        const colW = 34, rowH = 25, ox = 14, oy = 14;
        const exists = new Set([""]);
        for (const c in JA_DICT) for (let i = 1; i <= c.length; i++) exists.add(c.slice(0, i));
        const depth = (root) => Math.max(...[...exists].filter(c => c.startsWith(root)).map(c => c.length));
        const left = depth("ー"), right = depth("・");
        const cx = ox + left * colW;
        const nodes = {}, halves = [];
        for (const [root, dir] of [["・", 1], ["ー", -1]]) {
            const half = {}; let row = 0;
            (function place(p) {
                const kids = [p + "・", p + "ー"].filter(k => exists.has(k));
                const y = kids.length ? kids.map(place).reduce((a, b) => a + b) / kids.length : row++;
                half[p] = { x: cx + dir * p.length * colW, y, label: JA_DICT[p] || "" };
                return y;
            })(root);
            halves.push({ half, rows: row, root });
        }
        // 行数の少ない側を上下中央にそろえる
        const rows = Math.max(...halves.map(h => h.rows));
        for (const { half, rows: r } of halves) {
            for (const c in half) { half[c].y = (half[c].y + (rows - r) / 2) * rowH + oy; nodes[c] = half[c]; }
        }
        nodes[""] = { x: cx, y: (nodes["・"].y + nodes["ー"].y) / 2, label: "S" };
        const w = (left + right) * colW + ox * 2, h = (rows - 1) * rowH + oy * 2;
        return { viewBox: `0 0 ${w} ${h}`, nodes, size: 20, font: 11,
                 wire: (a, b) => `M ${a.x} ${a.y} H ${(a.x + b.x) / 2} V ${b.y} H ${b.x}` };
    }

    function buildChart() {
        const spec = alpha === 'ja' ? jaChart() : enChart();
        svgEl.setAttribute('viewBox', spec.viewBox);
        linesLayer.textContent = '';
        nodesLayer.textContent = '';
        nodeEls = {}; lineEls = {};
        for (const c in spec.nodes) {
            if (c === "") continue;
            const parent = spec.nodes[c.slice(0, -1)];
            if (!parent) continue;
            const path = document.createElementNS(SVG_NS, "path");
            // クランク（カクカク）状に配線
            path.setAttribute("d", spec.wire(parent, spec.nodes[c]));
            linesLayer.appendChild(path);
            lineEls[c] = path;
        }
        for (const c in spec.nodes) {
            const p = spec.nodes[c], s = spec.size;
            const g = document.createElementNS(SVG_NS, "g");
            g.setAttribute("class", "node" + (p.label ? "" : " blank"));
            const rect = document.createElementNS(SVG_NS, "rect");
            rect.setAttribute("x", p.x - s / 2);
            rect.setAttribute("y", p.y - s / 2);
            rect.setAttribute("width", s);
            rect.setAttribute("height", s);
            const text = document.createElementNS(SVG_NS, "text");
            text.setAttribute("x", p.x);
            text.setAttribute("y", p.y);
            text.setAttribute("font-size", spec.font);
            text.textContent = p.label;
            g.appendChild(rect);
            g.appendChild(text);
            nodesLayer.appendChild(g);
            nodeEls[c] = g;
        }
        update();
    }

    // ページ全体のスクロール/バウンスを抑止（スライダーと文字入力以外のタッチ移動を無効化）
    document.addEventListener('touchmove', (e) => {
        if (!e.target.closest('input')) e.preventDefault();
    }, { passive: false });
    // iOS Safari のピンチズームを抑止（ズームするとページがスクロール可能になってしまうため）
    document.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    // 万一ページがずれてしまった場合に備え、常に先頭位置へ戻す（ホーム画面起動時のタッチ判定ずれ対策）
    const resetScroll = () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); };
    window.addEventListener('scroll', resetScroll, { passive: true });
    window.addEventListener('resize', resetScroll);
    window.addEventListener('orientationchange', () => setTimeout(resetScroll, 100));
    window.addEventListener('pageshow', resetScroll);

    // 4. ロジック本体
    // 入力は「キーが下りた / 上がった」の 2 つだけに集約し、ボタンでもマイク（受信）でも自動送信でも同じ判定を通す
    let start = null, timer, code = "";
    const btn = document.getElementById('tap-btn');
    const msgEl = document.getElementById('message-box');
    const monitorEl = document.getElementById('code-monitor');
    // 速さは標準のモールスの決まりどおり 1 単位（ms）= 1200 / WPM（PARIS 方式）。
    // ・ = 1、ー = 3、符号の間 = 1、文字の間 = 3、単語の間 = 7 単位。
    // 受け取る側の境目はそれぞれの真ん中: ・/ー は 2 単位、文字の確定は 2 単位、単語の区切りは 5 単位の間
    const wpmEl = document.getElementById('wpm');
    const unit = () => 1200 / Number(wpmEl.value);
    const dashTh = () => unit() * 2;

    function update() {
        // すべてのリセット
        document.querySelectorAll('.node, path').forEach(el => el.classList.remove('active', 'active-dot', 'active-dash'));
        if (nodeEls[""]) nodeEls[""].classList.add('active');
        for (let i = 1; i <= code.length; i++) {
            const c = code.slice(0, i);
            if (!nodeEls[c]) break;
            lineEls[c].classList.add(code[i - 1] === '・' ? 'active-dot' : 'active-dash');
            nodeEls[c].classList.add('active');
        }
    }

    // ・ と ー の境目。AUTO のときは直近の長さを「短い組」と「長い組」に分け、その真ん中（対数で）を境目にする。
    // 打つ人の癖や、部屋の反響で音の尻尾が伸びる分に自動で合わせるため。2 組がはっきり分かれる（1.8 倍以上）まではスライダーの値を使う。
    // 雑音で一瞬だけ反応した打ちに引きずられないよう、0.4 単位未満は学ばず、どちらの組も 2 打以上あるときだけ採用する
    const durEl = document.getElementById('dur-monitor');
    let autoOn = true, autoTh = null, recentDur = [], curDurs = [];
    function learnDur(dur) {
        if (dur < Math.max(25, unit() * 0.4)) return;
        recentDur.push(dur);
        if (recentDur.length > 16) recentDur.shift();
        const L = recentDur.map(d => Math.log(Math.max(d, 1))).sort((a, b) => a - b);
        const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
        let best = null;
        for (let k = 2; k <= L.length - 2; k++) {
            const a = L.slice(0, k), b = L.slice(k), ma = mean(a), mb = mean(b);
            const cost = a.reduce((x, v) => x + (v - ma) ** 2, 0) + b.reduce((x, v) => x + (v - mb) ** 2, 0);
            if (!best || cost < best.cost) best = { cost, ma, mb };
        }
        if (best && Math.exp(best.mb - best.ma) >= 1.8) autoTh = Math.exp((best.ma + best.mb) / 2);
    }
    function dotDashTh() { return autoOn && autoTh ? autoTh : dashTh(); }
    // 間の判定に使う 1 単位。AUTO で相手が設定より遅いとわかったら、その遅さに合わせる（文字が途中で切れないように）
    function gapUnit() { return autoOn && autoTh ? Math.max(unit(), autoTh / 2) : unit(); }
    const letterTh = () => gapUnit() * 2;
    const wordTh = () => gapUnit() * 5;
    function resetAuto() { autoTh = null; recentDur = []; }
    function showDurs() {
        durEl.textContent = curDurs.map(([s, d]) => s + d).join(' ') + (curDurs.length ? '  ' : '') +
            '境目 ' + Math.round(dotDashTh()) + 'ms' + (autoOn ? (autoTh ? ' AUTO' : ' AUTO学習中') : '');
    }

    // 受け取った 1 文字を本文に足す。和文の ゛ ゜ は直前のカナとくっつける（カ + ゛ → ガ）
    function appendChar(ch) {
        const text = msgEl.textContent;
        if ((ch === '゛' || ch === '゜') && text) {
            const merged = (text.slice(-1) + (ch === '゛' ? '゙' : '゚')).normalize('NFC');
            if (merged.length === 1) { msgEl.textContent = text.slice(0, -1) + merged; return; }
        }
        msgEl.textContent = text + ch;
    }

    // 打ち込み中の符号を 1 文字として確定する
    function commitLetter() {
        if (!code) return;
        if (curDurs.length === code.length) code = curDurs.map(([, d]) => d < dotDashTh() ? "・" : "ー").join("");
        const res = morseDict[code];
        if (res) appendChar(res);
        curDurs = [];
        code = "";
        monitorEl.textContent = "";
        update();
    }

    function addSpace() {
        if (msgEl.textContent && !msgEl.textContent.endsWith(' ')) msgEl.textContent += ' ';
    }

    // 2 単位の間が空いたら 1 文字確定、5 単位空いたら単語の区切り（空白）。
    // タイマーが遅れて鳴ると次の文字とくっついてしまうので、次の音が来た時点でも
    // 「前の音からの間」を音の時刻で測って確定し直す（タイマーは画面を早く更新するためのもの）。
    let lastUp = null;
    function keyDown(t) {
        clearTimeout(timer);
        if (lastUp !== null) {
            const gap = t - lastUp;
            if (gap >= letterTh()) commitLetter();
            if (gap >= wordTh()) addSpace();
        }
        start = t;
    }

    function keyUp(t) {
        if (start === null) return;
        const dur = t - start;
        start = null;
        lastUp = t;

        learnDur(dur);
        const sym = (dur < dotDashTh()) ? "・" : "ー";
        code += sym;
        curDurs.push([sym, Math.round(dur)]);
        showDurs();
        monitorEl.textContent = code;
        update();

        timer = setTimeout(() => {
            commitLetter();
            timer = setTimeout(addSpace, wordTh() - letterTh());
        }, letterTh());
    }

    // イベント処理（iPhoneのマルチタッチやマウス両対応）
    // 受信モード中と自動送信中はボタンを無視する
    const handleStart = (e) => {
        e.preventDefault();
        if (mode === 'rx' || sending) return;
        if (mode === 'tx') toneOn();
        keyDown(performance.now());
    };

    const handleEnd = (e) => {
        if (mode === 'rx' || sending) return;
        if (mode === 'tx') toneOff();
        keyUp(performance.now());
    };

    btn.addEventListener('touchstart', handleStart);
    btn.addEventListener('touchend', handleEnd);
    btn.addEventListener('touchcancel', handleEnd);
    btn.addEventListener('mousedown', handleStart);
    btn.addEventListener('mouseup', handleEnd);

    // PC ではスペースキーでも打てる。ボタンにフォーカスがあると Space で「クリック」されてしまうので、先に横取りする
    let spaceDown = false;
    document.addEventListener('keydown', (e) => {
        if (e.code !== 'Space' || e.target.closest('input[type=text]')) return;
        e.preventDefault();
        if (e.repeat || spaceDown) return;
        spaceDown = true;
        btn.classList.add('pressed');
        handleStart(e);
    }, true);
    document.addEventListener('keyup', (e) => {
        if (e.code !== 'Space' || !spaceDown) return;
        e.preventDefault();
        spaceDown = false;
        btn.classList.remove('pressed');
        handleEnd(e);
    }, true);
    // 押したままウィンドウを離れたら離したことにする（鳴りっぱなし防止）
    window.addEventListener('blur', () => {
        if (!spaceDown) return;
        spaceDown = false;
        btn.classList.remove('pressed');
        handleEnd(new Event('blur'));
    });

    // 5. 無線（超音波）
    // 送信: ボタンを押している間だけ高い音を鳴らす。受信: マイクでその周波数だけを見張る。
    // 音の立ち上がり/立ち下がりを急にすると「プチッ」という聞こえる雑音（低い音を含む）が出るので、
    // 音量を二乗余弦の曲線でなめらかに増減する。直線で増減すると折れ目から雑音が漏れる。
    // 長さは 20ms まで。速いときは 1 単位の 1/4 に縮める（・ が増減だけで終わらないように）
    const rampSec = () => Math.min(0.02, unit() / 1000 * 0.25);
    function rampCurve(from, to) {
        const c = new Float32Array(32);
        for (let i = 0; i < c.length; i++) c[i] = from + (to - from) * (0.5 - 0.5 * Math.cos(Math.PI * i / (c.length - 1)));
        return c;
    }
    // 今の音量から to へなめらかに移る（途中の増減があれば、その時点の音量で止めてから）
    function glideTo(to) {
        const g = gain.gain, t = actx.currentTime, r = rampSec();
        try {
            if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t); else { g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); }
            g.setValueCurveAtTime(rampCurve(g.value, to), t + 0.002, r);
        } catch (e) {
            // 曲線を予約できない環境では直線で
            try { g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(to, t + r); } catch (e2) {}
        }
    }
    let mode = 'local', actx = null, osc = null, gain = null;
    let micStream = null;
    const statusEl = document.getElementById('radio-status');
    const freqEl = document.getElementById('freq');
    const rxThEl = document.getElementById('rx-thresh');

    function setStatus(msg, err) {
        statusEl.textContent = msg || '';
        statusEl.classList.toggle('err', !!err);
    }

    function audioCtx() {
        if (!actx) {
            actx = new (window.AudioContext || window.webkitAudioContext)();
            // 作れる音の上限はサンプリング周波数の半分。それを超えると低い音に化けて聞こえてしまうので、1kHz の余裕を残して制限する
            const lim = Math.floor((actx.sampleRate / 2 - 1000) / 100) * 100;
            if (Number(freqEl.max) > lim) {
                freqEl.max = lim;
                if (Number(freqEl.value) > lim) { freqEl.value = lim; freqEl.dispatchEvent(new Event('input')); }
            }
        }
        if (actx.state === 'suspended') actx.resume();
        return actx;
    }
    const freqLimitNote = () => '（この端末は ' + (freqEl.max / 1000).toFixed(1) + 'kHz まで）';

    function toneOn() {
        if (!gain) return;
        const t = actx.currentTime;
        osc.frequency.setValueAtTime(Number(freqEl.value), t);
        glideTo(1);
        document.body.classList.add('tone-on');
    }

    function toneOff() {
        if (!gain) return;
        glideTo(0);
        document.body.classList.remove('tone-on');
    }

    function startTx() {
        // iPhone のマナーモードでも Web Audio を鳴らせるようにする（Safari 16.4+）
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
        const ctx = audioCtx();
        osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = Number(freqEl.value);
        gain = ctx.createGain();
        gain.gain.value = 0;
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        setStatus('送信中: SIGNAL を押している間だけ ' + (freqEl.value / 1000).toFixed(1) + 'kHz を出します。音量は最大に' + freqLimitNote());
    }

    function stopTx() {
        if (osc) { try { osc.stop(); } catch (e) {} osc.disconnect(); }
        osc = null; gain = null;
        document.body.classList.remove('tone-on');
    }

    async function startRx() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setStatus('マイクが使えません（https で開いてください）', true);
            return false;
        }
        try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) {}
        const ctx = audioCtx();
        let stream;
        try {
            // 音声通話向けの加工（エコー除去・雑音除去・自動音量）は高い音を消してしまうので切る
            stream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            });
        } catch (e) {
            setStatus('マイクを使う許可がありません: ' + e.message, true);
            return false;
        }
        // 許可を待つ間に別のモードへ切り替えられていたら捨てる
        if (mode !== 'rx') { stream.getTracks().forEach(tr => tr.stop()); return true; }
        micStream = stream;
        try {
            await attachDetector(ctx.createMediaStreamSource(micStream));
        } catch (e) {
            setStatus('受信の準備に失敗しました: ' + e.message, true);
            return false;
        }
        setStatus('受信中: ' + (freqEl.value / 1000).toFixed(1) + 'kHz を聞いています' + freqLimitNote());
        return true;
    }

    function stopRx() {
        if (detector) { detector.port.onmessage = null; detector.disconnect(); }
        if (rxSource) rxSource.disconnect();
        detector = null; rxSource = null;
        if (micStream) micStream.getTracks().forEach(tr => tr.stop());
        micStream = null;
        if (start !== null) keyUp(rxLastT);
        document.getElementById('meter-fill').style.width = '0';
        document.getElementById('meter').classList.remove('hit');
    }

    // 受信の判定は音声処理スレッド（AudioWorklet）で、届いた音を 1 サンプルも飛ばさずに行う。
    // 画面側のタイマーで覗きに行くと、処理が詰まった瞬間の短い ・ や隙間を取りこぼすため。
    // - 128 サンプルごとに直近 512 サンプル（48kHz で約 11ms）を窓にかけ、目当ての周波数の強さを測る
    // - 比較用に 0.5〜1.9kHz 下の 8 点も測り、その中央値との差（dB）で判定する。
    //   周囲の雑音が大きくなっても差で見るので、しきい値を毎回合わせ直さなくて済む。
    //   上側はマイクのフィルタで削られていることがあるので使わない
    // - チラつきで ・ を誤検出しないよう、状態が STABLE ms 続いたら確定し、時刻は変化した瞬間まで遡る
    // - 時刻は音声の時計（サンプル数）で数えるので、画面側の揺れが長さに乗らない
    const STABLE = 20, OFF_HYST = 3, METER_MAX = 40;
    const DETECTOR_SRC = `
        class MorseDetector extends AudioWorkletProcessor {
            constructor() {
                super();
                this.N = 512;
                this.ring = new Float32Array(this.N); this.pos = 0; this.frames = 0;
                this.win = new Float32Array(this.N);
                for (let i = 0; i < this.N; i++) this.win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (this.N - 1));
                this.freq = 18500; this.th = 12;
                this.sigP = 0; this.refP = new Float64Array(8);
                this.raw = false; this.rawSince = 0; this.on = false; this.peak = -99; this.blocks = 0;
                this.port.onmessage = (e) => { if (e.data.freq) this.freq = e.data.freq; if (e.data.th) this.th = e.data.th; };
            }
            power(f) {
                // ゲルツェル法: 1 つの周波数だけの強さを求める
                const w = 2 * Math.PI * f / sampleRate, c = 2 * Math.cos(w);
                let s1 = 0, s2 = 0;
                for (let i = 0; i < this.N; i++) {
                    const s0 = this.ring[(this.pos + i) % this.N] * this.win[i] + c * s1 - s2;
                    s2 = s1; s1 = s0;
                }
                return s1 * s1 + s2 * s2 - c * s1 * s2;
            }
            process(inputs) {
                const ch = inputs[0] && inputs[0][0];
                if (!ch) return true;
                for (let i = 0; i < ch.length; i++) { this.ring[this.pos] = ch[i]; this.pos = (this.pos + 1) % this.N; }
                this.frames += ch.length;
                // 強さは直前の値と半々にならし、雑音の一瞬の山で「まだ鳴っている」と見誤らないようにする
                const db = (p) => 10 * Math.log10(p + 1e-20);
                this.sigP = 0.5 * this.sigP + 0.5 * this.power(this.freq);
                for (let k = 0; k < 8; k++) this.refP[k] = 0.5 * this.refP[k] + 0.5 * this.power(this.freq - 500 - k * 200);
                const ref = Array.from(this.refP).sort((a, b) => a - b);
                const snr = db(this.sigP) - db((ref[3] + ref[4]) / 2);
                // 窓の中心の時刻（ms）
                const now = (this.frames - this.N / 2) / sampleRate * 1000;
                const want = this.on ? snr > this.th - ${OFF_HYST} : snr > this.th;
                if (want !== this.raw) { this.raw = want; this.rawSince = now; }
                if (this.raw !== this.on && now - this.rawSince >= ${STABLE}) {
                    this.on = this.raw;
                    this.port.postMessage({ edge: this.on, t: this.rawSince });
                }
                this.peak = Math.max(this.peak, snr);
                if (++this.blocks >= 12) { this.port.postMessage({ snr: this.peak, on: this.on, t: now }); this.peak = -99; this.blocks = 0; }
                return true;
            }
        }
        registerProcessor('morse-detector', MorseDetector);`;
    let detector = null, rxSource = null, rxLastT = 0, workletReady = null;

    // 音源（マイクなど）を判定器につなぐ
    async function attachDetector(source) {
        const ctx = audioCtx();
        if (!workletReady) {
            const url = URL.createObjectURL(new Blob([DETECTOR_SRC], { type: 'application/javascript' }));
            workletReady = ctx.audioWorklet.addModule(url);
        }
        await workletReady;
        detector = new AudioWorkletNode(ctx, 'morse-detector', { numberOfOutputs: 1 });
        detector.port.postMessage({ freq: Number(freqEl.value), th: Number(rxThEl.value) });
        detector.port.onmessage = (e) => {
            const d = e.data;
            rxLastT = d.t;
            if ('edge' in d) { if (d.edge) keyDown(d.t); else keyUp(d.t); return; }
            const fill = Math.max(0, Math.min(1, d.snr / METER_MAX));
            document.getElementById('meter-fill').style.width = (fill * 100) + '%';
            document.getElementById('meter').classList.toggle('hit', d.on);
        };
        // 出口（スピーカー）につながっていないノードはブラウザが処理を省くことがあるので、音量 0 でつないでおく
        const mute = ctx.createGain();
        mute.gain.value = 0;
        rxSource = source;
        source.connect(detector).connect(mute).connect(ctx.destination);
    }

    async function setMode(m) {
        if (m === mode) return;
        stopSend();
        if (mode === 'tx') stopTx();
        if (mode === 'rx') stopRx();
        mode = m;
        lastUp = null;
        resetAuto(); showDurs();
        document.querySelectorAll('.mode-group button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
        document.body.classList.toggle('mode-rx', m === 'rx');
        setStatus('');
        if (m === 'tx') startTx();
        if (m === 'rx') { const ok = await startRx(); if (!ok && mode === 'rx') setMode('local'); }
    }

    document.querySelectorAll('.mode-group button').forEach(b => {
        b.addEventListener('click', () => setMode(b.dataset.mode));
    });

    // 6. 文章の自動送信
    // 打った文章を符号に直し、SIGNAL を押すのと同じ長さで鳴らす。長さは受け手の判定に合わせて
    // 標準の比（1 / 3 / 1 / 3 / 7 単位）で打つ。2 台の SPEED が多少ずれていても読み取れる。
    let sending = false, sendTimers = [];
    const sendInput = document.getElementById('send-text');
    const sendBtn = document.getElementById('send-btn');
    const SMALL_KANA = { "ァ":"ア","ィ":"イ","ゥ":"ウ","ェ":"エ","ォ":"オ","ッ":"ツ","ャ":"ヤ","ュ":"ユ","ョ":"ヨ","ヮ":"ワ","ヵ":"カ","ヶ":"ケ" };

    // 文章 → [{ch, code}]（空白は code: " "）。送れない文字は skipped に集める
    function encode(text) {
        const dict = {};
        for (const c in morseDict) dict[morseDict[c]] = c;
        const out = [], skipped = new Set();
        let s = text.normalize('NFKC');
        if (alpha === 'en') s = s.toUpperCase();
        // 和文: ひらがな → カタカナ、濁音は「清音 + ゛」に分ける（ガ → カ ゛）
        if (alpha === 'ja') s = s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60)).normalize('NFD');
        for (let ch of s) {
            if (ch === '゙') ch = '゛';
            if (ch === '゚') ch = '゜';
            if (alpha === 'ja') { ch = SMALL_KANA[ch] || ch; if (ch === '-') ch = 'ー'; if (ch === ',') ch = '、'; if (ch === '.') ch = '。'; }
            if (/\s/.test(ch)) { if (out.length && out[out.length - 1].code !== ' ') out.push({ ch: ' ', code: ' ' }); continue; }
            if (dict[ch]) out.push({ ch, code: dict[ch] });
            else skipped.add(ch);
        }
        while (out.length && out[out.length - 1].code === ' ') out.pop();
        return { out, skipped: [...skipped] };
    }

    function sendText() {
        if (sending) { stopSend(); return; }
        if (mode === 'rx') return;
        const { out, skipped } = encode(sendInput.value);
        if (!out.length) {
            setStatus(skipped.length ? '送れる文字がありません（' + (alpha === 'ja' ? '和文はカナ・数字' : '欧文は英字・数字') + 'だけ）' : '', !!skipped.length);
            return;
        }
        const u = unit();
        const dot = u, dash = u * 3, gap = u, letterGap = u * 3, wordGap = u * 7;
        const events = [];   // [開始ms, 長さms, 何文字目]
        let t = 0;
        out.forEach((o, idx) => {
            if (o.code === ' ') { t += wordGap - letterGap; return; }
            for (const s of o.code) {
                const len = s === '・' ? dot : dash;
                events.push([t, len, idx]);
                t += len + gap;
            }
            t += letterGap - gap;
        });

        sending = true;
        document.body.classList.add('sending');
        sendBtn.textContent = 'STOP';
        const lead = 150;
        const t0 = performance.now() + lead;
        if (mode === 'tx' && gain) {
            // 音は Web Audio の時計で予約しておく（setTimeout の揺れが音の長さに乗らない）
            const a0 = actx.currentTime + lead / 1000;
            const g = gain.gain;
            g.cancelScheduledValues(actx.currentTime);
            g.setValueAtTime(0, actx.currentTime);
            const r = rampSec(), up = rampCurve(0, 1), down = rampCurve(1, 0);
            for (const [s, len] of events) {
                const ts = a0 + s / 1000, te = ts + len / 1000;
                g.setValueCurveAtTime(up, ts, r);
                g.setValueCurveAtTime(down, te - r, r);
            }
        }
        // 画面（回路図と本文）は手で打ったときと同じ処理で動かす
        const visible = out.filter(o => o.code !== ' ').length;
        for (const [s, len, idx] of events) {
            sendTimers.push(setTimeout(() => {
                keyDown(t0 + s);
                document.body.classList.add('tone-on');
                setStatus('自動送信中: ' + out.slice(0, idx + 1).map(o => o.ch).join('') + '（' + (out.slice(0, idx + 1).filter(o => o.code !== ' ').length) + '/' + visible + '）');
            }, t0 + s - performance.now()));
            sendTimers.push(setTimeout(() => {
                keyUp(t0 + s + len);
                document.body.classList.remove('tone-on');
            }, t0 + s + len - performance.now()));
        }
        sendTimers.push(setTimeout(() => finishSend(skipped), t0 + t - performance.now()));
    }

    function finishSend(skipped) {
        sending = false;
        sendTimers = [];
        document.body.classList.remove('sending', 'tone-on');
        sendBtn.textContent = 'SEND';
        setStatus(skipped && skipped.length ? '送れなかった文字: ' + skipped.join(' ') : '送信しました', !!(skipped && skipped.length));
    }

    function stopSend() {
        if (!sending) return;
        sendTimers.forEach(clearTimeout);
        if (gain) glideTo(0);
        if (start !== null) keyUp(performance.now());
        finishSend();
        setStatus('送信を止めました');
    }

    sendBtn.addEventListener('click', sendText);
    sendInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendText(); } });

    // 7. 欧文 / 和文の切り替え
    function setAlpha(a) {
        if (a === alpha) return;
        stopSend();
        alpha = a;
        morseDict = ALPHABETS[a];
        code = "";
        lastUp = null;
        monitorEl.textContent = "";
        clearTimeout(timer);
        document.querySelectorAll('.alpha-group button').forEach(b => b.classList.toggle('on', b.dataset.alpha === a));
        sendInput.placeholder = a === 'ja' ? 'カナ・ひらがな・数字（例: コンニチハ）' : 'A-Z / 0-9（例: HELLO WORLD）';
        buildChart();
    }
    document.querySelectorAll('.alpha-group button').forEach(b => {
        b.addEventListener('click', () => setAlpha(b.dataset.alpha));
    });

    // リセット関数
    function fullReset() {
        stopSend();
        msgEl.textContent = "";
        monitorEl.textContent = "";
        clearTimeout(timer);
        code = "";
        curDurs = [];
        lastUp = null;
        resetAuto(); showDurs();
        update();
    }

    // 設定スライダー
    function showSpeed() {
        const u = unit();
        document.getElementById('v-wpm').innerText = wpmEl.value + "WPM";
        document.getElementById('v-timing').innerText = '・' + Math.round(u) + ' ー' + Math.round(u * 3) + ' 字間' + Math.round(u * 3) + ' 語間' + Math.round(u * 7) + 'ms';
        showDurs();
    }
    wpmEl.oninput = showSpeed;
    showSpeed();
    document.getElementById('auto-btn').addEventListener('click', function() {
        autoOn = !autoOn;
        this.classList.toggle('on', autoOn);
        showDurs();
    });
    showDurs();
    freqEl.oninput = function() {
        document.getElementById('v-freq').innerText = (this.value / 1000).toFixed(1) + "kHz";
        if (osc) osc.frequency.setValueAtTime(Number(this.value), actx.currentTime);
        if (detector) detector.port.postMessage({ freq: Number(this.value) });
    };
    function showRxTh() {
        document.getElementById('v-rx').innerText = rxThEl.value + "dB";
        document.getElementById('meter-th').style.left = Math.min(100, rxThEl.value / METER_MAX * 100) + '%';
    }
    rxThEl.oninput = () => {
        showRxTh();
        if (detector) detector.port.postMessage({ th: Number(rxThEl.value) });
    };
    showRxTh();

    buildChart();
</script>
</body>
</html>
