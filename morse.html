<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- black-translucent にするとホーム画面起動時にタッチ判定がステータスバー分ずれる iOS の既知バグがあるため black を使う -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#050505">
    <title>Morse Matrix Circuit v2</title>
    <style>
        :root {
            --bg: #050505;
            --panel-bg: #0d1117;
            --line-dim: #1a1a1a;
            --gold: #8c7340;
            --active: #f6e62e;
            --dot-color: #00d4ff;
            --dash-color: #ff3333;
            --unit-w: 45px;
            --unit-h: 38px;
            --ox: 40px;
            --oy: 45px;
        }

        /* iOSでの誤作動防止（長押し・選択・ズームの禁止） */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: manipulation;
            box-sizing: border-box;
        }

        html { height: 100%; overscroll-behavior: none; }
        body { 
            background: var(--bg); color: #adbac7; font-family: 'Consolas', 'Courier New', monospace; 
            margin: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden;
            /* iOS Safari の URL バー/ツールバー分を除いた実際の表示領域に合わせる。
               height を指定せず top/bottom の固定だけにすることで、Safari でもホーム画面起動時でも
               レイアウトと実際の画面サイズが必ず一致する（ズレによるタッチ判定の食い違いを防ぐ） */
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%;
            overscroll-behavior: none;
        }

        /* 1. 出力セクション */
        .output-section {
            width: 100%; padding: 15px; background: var(--panel-bg); 
            padding-top: calc(15px + env(safe-area-inset-top));
            display: grid; grid-template-columns: 1fr 2fr; gap: 10px;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }
        .display-box { background: #000; border: 1px solid #222; padding: 10px; border-radius: 4px; min-height: 55px; }
        .label { font-size: 0.6rem; color: #555; margin-bottom: 4px; text-transform: uppercase; }
        #code-monitor { font-size: 1.1rem; color: #539bf5; min-height: 1.2em; letter-spacing: 3px; }
        #message-box { font-size: 1.4rem; color: var(--active); min-height: 1.2em; word-break: break-all; }

        /* 2. チャート表示セクション */
        #chart-viewport {
            flex: 1; width: 100%; min-height: 0; position: relative;
            overflow: hidden; /* スクロールさせない */
            touch-action: none; /* タッチでのパン/ズームを禁止 */
            background: radial-gradient(circle, #080808 0%, #000 100%);
        }
        /* チャート全体を 1 枚の SVG として描画し、viewBox で表示領域にぴったり収める
           （固定サイズの要素が存在しないので、はみ出し = スクロールが発生しない） */
        #chart {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: block; overflow: hidden; pointer-events: none;
        }
        #chart path { fill: none; stroke: var(--line-dim); stroke-width: 1.5; transition: stroke 0.2s; }
        #chart path.active-dot { stroke: var(--dot-color); stroke-width: 3; filter: drop-shadow(0 0 4px var(--dot-color)); }
        #chart path.active-dash { stroke: var(--dash-color); stroke-width: 3; filter: drop-shadow(0 0 4px var(--dash-color)); }

        .node rect { fill: #000; stroke: var(--gold); stroke-width: 1; transition: 0.2s; }
        .node text {
            fill: var(--gold); font-size: 11px; font-weight: bold; font-family: inherit;
            text-anchor: middle; dominant-baseline: central; transition: 0.2s;
        }
        .node.active rect { fill: var(--active); stroke: #fff; filter: drop-shadow(0 0 8px var(--active)); }
        .node.active text { fill: #000; }

        /* 3. コントロールセクション */
        .controls {
            width: 100%; padding: 20px; background: var(--panel-bg);
            border-top: 1px solid #222; display: flex; justify-content: space-between; align-items: center;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            flex-shrink: 0;
        }
        .param-group { display: flex; flex-direction: column; gap: 10px; }
        .param { display: flex; align-items: center; gap: 12px; font-size: 0.7rem; color: #888; }
        .param span:first-child { width: 80px; }
        input[type=range] { width: 90px; accent-color: var(--gold); }
        
        #tap-btn {
            width: 95px; height: 95px; border-radius: 50%; border: 4px solid var(--gold);
            background: radial-gradient(circle, #222, #000); color: #fff;
            cursor: pointer; font-size: 0.9rem; font-weight: bold; font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            flex-shrink: 0; /* 狭い画面でも円形を保つ */
        }
        #tap-btn:active { background: #333; transform: scale(0.94); box-shadow: none; }
        
        .reset-btn { 
            background: #2a0000; color: #ff6666; border: 1px solid #552222; 
            padding: 6px 12px; border-radius: 4px; font-size: 0.7rem; cursor: pointer;
            margin-top: 8px; text-align: center;
        }

        /* 4. 幅の狭い端末（320px 前後）向け: コントロールをコンパクトにして横にはみ出さないようにする */
        @media (max-width: 360px) {
            .controls { padding-left: 12px; padding-right: 12px; gap: 8px; }
            .param { gap: 8px; font-size: 0.65rem; }
            .param span:first-child { width: 56px; }
            input[type=range] { width: 70px; }
            #tap-btn { width: 80px; height: 80px; font-size: 0.8rem; }
            .output-section { padding-left: 10px; padding-right: 10px; gap: 8px; }
        }

        /* 5. 横向き（高さが足りない画面）向け: チャートを左いっぱいに、表示と操作パネルを右側の列にまとめる */
        @media (orientation: landscape) and (max-height: 540px) {
            body {
                display: grid;
                grid-template-columns: 1fr minmax(230px, 300px);
                grid-template-rows: auto 1fr;
                align-items: stretch;
            }
            #chart-viewport {
                grid-column: 1; grid-row: 1 / 3;
                padding-left: env(safe-area-inset-left);
            }
            .output-section {
                grid-column: 2; grid-row: 1;
                grid-template-columns: 1fr; gap: 8px;
                padding: 10px; padding-top: calc(10px + env(safe-area-inset-top));
                padding-right: calc(10px + env(safe-area-inset-right));
                border-bottom: 1px solid #222; border-left: 1px solid #222;
            }
            .display-box { min-height: 44px; }
            #message-box { font-size: 1.1rem; }
            .controls {
                grid-column: 2; grid-row: 2;
                flex-direction: column; justify-content: space-evenly; gap: 8px;
                padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
                padding-right: calc(10px + env(safe-area-inset-right));
                border-top: none; border-left: 1px solid #222;
                min-height: 0; overflow: hidden;
            }
            .param-group { gap: 6px; }
            .reset-btn { margin-top: 4px; }
            #tap-btn { width: 80px; height: 80px; }
        }

        /* 6. さらに高さの低い横向き画面（320px 前後）向け: 右列をよりコンパクトに */
        @media (orientation: landscape) and (max-height: 360px) {
            .output-section { padding: 6px; padding-top: calc(6px + env(safe-area-inset-top)); gap: 6px; }
            .display-box { min-height: 36px; padding: 6px 8px; }
            .label { margin-bottom: 2px; }
            #code-monitor { font-size: 0.9rem; min-height: 1em; }
            #message-box { font-size: 1rem; min-height: 1em; }
            .controls { padding: 6px 10px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); gap: 4px; }
            .param { gap: 8px; font-size: 0.62rem; }
            .param span:first-child { width: 56px; }
            input[type=range] { width: 70px; }
            .param-group { gap: 4px; }
            .reset-btn { margin-top: 2px; padding: 4px 8px; }
            #tap-btn { width: 64px; height: 64px; font-size: 0.75rem; border-width: 3px; }
        }
    </style>
</head>
<body>

<div class="output-section">
    <div class="display-box">
        <div class="label">Incoming Code</div>
        <div id="code-monitor"></div>
    </div>
    <div class="display-box">
        <div class="label">Decoded Message</div>
        <div id="message-box"></div>
    </div>
</div>

<div id="chart-viewport">
    <svg id="chart" viewBox="0 0 450 350" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <g id="lines"></g>
        <g id="nodes"></g>
    </svg>
</div>

<div class="controls">
    <div class="param-group">
        <div class="param">
            <span>DASH-TH</span>
            <input type="range" id="dash-thresh" min="100" max="400" value="200">
            <span id="v-dash">200ms</span>
        </div>
        <div class="param">
            <span>WAIT-TH</span>
            <input type="range" id="wait-thresh" min="400" max="1500" value="800">
            <span id="v-wait">800ms</span>
        </div>
        <div class="reset-btn" onclick="fullReset()">SYSTEM RESET</div>
    </div>
    <button id="tap-btn">SIGNAL</button>
</div>

<script>
    // 1. 全アルファベット辞書（省略なし）
    const morseDict = {
        "・":"E","・・":"I","・・・":"S","・・・・":"H","・ー":"A","・ー・":"R","・ー・・":"L","・・ー":"U","・・ー・":"F","・・・ー":"V","・ーー":"W","・ーー・":"P","・ーーー":"J",
        "ー":"T","ーー":"M","ーーー":"O","ー・":"N","ー・・":"D","ー・・・":"B","ー・ー":"K","ー・ー・":"C","ー・ーー":"Y","ーー・":"G","ーー・・":"Z","ーー・ー":"Q","ー・・ー":"X"
    };

    // 2. 遷移ツリー（省略なし）
    const tree = {
        "start": {"・":"E", "ー":"T"},
        "E": {"・":"I", "ー":"A"}, "I": {"・":"S", "ー":"U"}, "S": {"・":"H", "ー":"V"}, "U": {"・":"F"},
        "A": {"・":"R", "ー":"W"}, "R": {"・":"L"}, "W": {"・":"P", "ー":"J"},
        "T": {"・":"N", "ー":"M"}, "N": {"・":"D", "ー":"K"}, "D": {"・":"B", "ー":"X"}, "M": {"・":"G", "ー":"O"},
        "G": {"・":"Z", "ー":"Q"}, "K": {"・":"C", "ー":"Y"}
    };

    // ノード配置（グリッド座標）
    const nodeDefs = {
        start: {x:3, y:0, label:"S"},
        o: {x:0, y:-1, label:"O"}, m: {x:1, y:-1, label:"M"}, t: {x:2, y:-1, label:"T"},
        q: {x:0, y:-2, label:"Q"}, g: {x:1, y:-2, label:"G"}, z: {x:1, y:-3, label:"Z"},
        y: {x:0, y:-4, label:"Y"}, k: {x:1, y:-4, label:"K"}, n: {x:2, y:-4, label:"N"},
        c: {x:1, y:-5, label:"C"}, x: {x:1, y:-6, label:"X"}, d: {x:2, y:-6, label:"D"}, b: {x:2, y:-7, label:"B"},
        e: {x:4, y:-1, label:"E"}, i: {x:5, y:-1, label:"I"}, s: {x:7, y:-1, label:"S"}, h: {x:8, y:-1, label:"H"},
        u: {x:5, y:-2, label:"U"}, f: {x:6, y:-2, label:"F"}, v: {x:7, y:-2, label:"V"},
        a: {x:4, y:-4, label:"A"}, r: {x:5, y:-4, label:"R"}, l: {x:7, y:-4, label:"L"},
        w: {x:4, y:-6, label:"W"}, p: {x:5, y:-6, label:"P"}, j: {x:4, y:-7, label:"J"}
    };

    const SVG_NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById('lines');
    const nodesLayer = document.getElementById('nodes');
    const uw = 45, uh = 38, ox = 40, oy = 45, nodeSize = 20;

    // 3. 座標計算とノード配置
    function getPos(id) {
        const d = nodeDefs[id.toLowerCase()];
        return d ? { x: d.x * uw + ox, y: Math.abs(d.y) * uh + oy } : {x:0, y:0};
    }

    for (let id in nodeDefs) {
        const p = getPos(id);
        const g = document.createElementNS(SVG_NS, "g");
        g.setAttribute("class", "node" + (id === "start" ? " active" : ""));
        g.id = `n-${id}`;
        const rect = document.createElementNS(SVG_NS, "rect");
        rect.setAttribute("x", p.x - nodeSize / 2);
        rect.setAttribute("y", p.y - nodeSize / 2);
        rect.setAttribute("width", nodeSize);
        rect.setAttribute("height", nodeSize);
        const text = document.createElementNS(SVG_NS, "text");
        text.setAttribute("x", p.x);
        text.setAttribute("y", p.y);
        text.textContent = nodeDefs[id].label;
        g.appendChild(rect);
        g.appendChild(text);
        nodesLayer.appendChild(g);
    }

    // 4. SVG配線の初期描画
    for (let from in tree) {
        for (let sym in tree[from]) {
            const to = tree[from][sym];
            const p1 = getPos(from), p2 = getPos(to);
            const path = document.createElementNS(SVG_NS, "path");
            // クランク（カクカク）状に配線
            path.setAttribute("d", `M ${p1.x} ${p1.y} V ${(p1.y + p2.y) / 2} H ${p2.x} V ${p2.y}`);
            path.id = `line-${from}-${to}`;
            svg.appendChild(path);
        }
    }

    // ページ全体のスクロール/バウンスを抑止（スライダー以外のタッチ移動を無効化）
    document.addEventListener('touchmove', (e) => {
        if (!e.target.closest('input[type=range]')) e.preventDefault();
    }, { passive: false });
    // iOS Safari のピンチズームを抑止（ズームするとページがスクロール可能になってしまうため）
    document.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    // 万一ページがずれてしまった場合に備え、常に先頭位置へ戻す（ホーム画面起動時のタッチ判定ずれ対策）
    const resetScroll = () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); };
    window.addEventListener('scroll', resetScroll, { passive: true });
    window.addEventListener('resize', resetScroll);
    window.addEventListener('orientationchange', () => setTimeout(resetScroll, 100));
    window.addEventListener('pageshow', resetScroll);

    // 5. ロジック本体
    let start, timer, code = "";
    const btn = document.getElementById('tap-btn');

    function update() {
        // すべてのリセット
        document.querySelectorAll('.node, path').forEach(el => el.classList.remove('active', 'active-dot', 'active-dash'));
        document.getElementById('n-start').classList.add('active');
        
        let curr = "start";
        for (let s of code.split('')) {
            const next = tree[curr] ? tree[curr][s] : null;
            if (next) {
                const line = document.getElementById(`line-${curr}-${next}`);
                if (line) line.classList.add(s === '・' ? 'active-dot' : 'active-dash');
                const n = document.getElementById(`n-${next.toLowerCase()}`);
                if (n) n.classList.add('active');
                curr = next;
            }
        }
    }

    // イベント処理（iPhoneのマルチタッチやマウス両対応）
    const handleStart = (e) => {
        e.preventDefault();
        start = Date.now();
        clearTimeout(timer);
    };

    const handleEnd = (e) => {
        const dur = Date.now() - start;
        if (!start) return;
        start = null;
        
        code += (dur < document.getElementById('dash-thresh').value) ? "・" : "ー";
        document.getElementById('code-monitor').innerText = code;
        update();

        timer = setTimeout(() => {
            const res = morseDict[code];
            if (res) document.getElementById('message-box').innerText += res;
            code = "";
            document.getElementById('code-monitor').innerText = "";
            update();
        }, document.getElementById('wait-thresh').value);
    };

    btn.addEventListener('touchstart', handleStart);
    btn.addEventListener('touchend', handleEnd);
    btn.addEventListener('mousedown', handleStart);
    btn.addEventListener('mouseup', handleEnd);

    // リセット関数
    function fullReset() {
        document.getElementById('message-box').innerText = "";
        document.getElementById('code-monitor').innerText = "";
        code = "";
        update();
    }

    // 設定スライダー
    document.getElementById('dash-thresh').oninput = function() { document.getElementById('v-dash').innerText = this.value + "ms"; };
    document.getElementById('wait-thresh').oninput = function() { document.getElementById('v-wait').innerText = this.value + "ms"; };
</script>
</body>
</html>
